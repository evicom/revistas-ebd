<script>
  // CONFIGURAÇÕES DA API JSONBIN.IO (V3)
  const BIN_ID = '6a85b1bff5f4af5e2928ba89';
  const MASTER_KEY = '$2a$10$69I.WVd28qtbrr8JyLiIXOBsdBg4qwbDinwcf1f592s6KIdaZh8rO';
  const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  // Estado Local dos Dados
  let AppData = {
    clientes: [],
    pedidos: [],
    valores: { aluno: 10, professor: 15 }
  };

  // Alternar Abas da Navegação
  function switchTab(tabKey) {
    document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(`sec-${tabKey}`).classList.add('active');
  }

  // CARREGAR DADOS DA NUVEM
  async function carregarDaNuvem() {
    const statusEl = document.getElementById('cloudStatus');
    statusEl.className = 'status-loading';
    statusEl.innerText = '☁️ Carregando dados do JSONBin...';

    try {
      const response = await fetch(`${API_URL}/latest`, {
        method: 'GET',
        headers: {
          'X-Master-Key': MASTER_KEY
        }
      });

      if (!response.ok) throw new Error(`Status ${response.status}`);

      const data = await response.json();
      if (data.record) {
        AppData = {
          clientes: data.record.clientes || [],
          pedidos: data.record.pedidos || [],
          valores: data.record.valores || { aluno: 0, professor: 0 }
        };
        statusEl.className = 'status-success';
        statusEl.innerText = '✅ Dados em sincronia com a nuvem!';
      }
    } catch (err) {
      console.error(err);
      statusEl.className = 'status-error';
      statusEl.innerText = '❌ Erro ao conectar com o JSONBin. Verifique se o BIN ID e a Master Key pertencem à mesma conta.';
    } finally {
      renderizarTudo();
    }
  }

  // SALVAR DADOS NA NUVEM
  async function salvarNaNuvem() {
    const statusEl = document.getElementById('cloudStatus');
    statusEl.className = 'status-loading';
    statusEl.innerText = '⏳ Salvando dados na nuvem...';

    try {
      const response = await fetch(API_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify(AppData)
      });

      if (!response.ok) throw new Error(`Status ${response.status}`);

      statusEl.className = 'status-success';
      statusEl.innerText = '✅ Dados salvos com sucesso na nuvem!';
    } catch (err) {
      console.error(err);
      statusEl.className = 'status-error';
      statusEl.innerText = '❌ Falha ao salvar dados no JSONBin.';
    }
  }

  // Lógica de Cadastro
  function cadastrarCliente() {
    const nome = document.getElementById('cli-nome').value.trim();
    const faixa = document.getElementById('cli-faixa').value;
    const tipo = document.getElementById('cli-tipo').value;
    const fone = document.getElementById('cli-fone').value.trim();

    if (!nome) { alert('Digite o nome do cliente!'); return; }

    AppData.clientes.push({ id: Date.now(), nome, faixa, tipo, fone });
    document.getElementById('cli-nome').value = '';
    document.getElementById('cli-fone').value = '';

    renderizarTudo();
    salvarNaNuvem();
  }

  function deletarCliente(id) {
    AppData.clientes = AppData.clientes.filter(c => c.id !== id);
    renderizarTudo();
    salvarNaNuvem();
  }

  function salvarValores() {
    AppData.valores.aluno = parseFloat(document.getElementById('val-aluno').value) || 0;
    AppData.valores.professor = parseFloat(document.getElementById('val-prof').value) || 0;
    
    renderizarTudo();
    salvarNaNuvem();
    alert('Valores atualizados!');
  }

  function lancarPedido() {
    const clienteId = document.getElementById('ped-cliente').value;
    const trimestre = document.getElementById('ped-trimestre').value;
    const tipoRevista = document.getElementById('ped-tipo').value;
    const qtd = parseInt(document.getElementById('ped-qtd').value) || 1;

    if (!clienteId) { alert('Selecione um cliente!'); return; }

    const cliente = AppData.clientes.find(c => c.id == clienteId);
    const precoUnitario = tipoRevista === 'aluno' ? AppData.valores.aluno : AppData.valores.professor;
    const valorTotal = precoUnitario * qtd;

    AppData.pedidos.push({
      id: Date.now(),
      clienteNome: cliente ? cliente.nome : 'Desconhecido',
      trimestre,
      tipoRevista,
      qtd,
      valorTotal,
      pago: false
    });

    renderizarTudo();
    salvarNaNuvem();
  }

  function alternarStatusPedido(id) {
    const ped = AppData.pedidos.find(p => p.id === id);
    if (ped) {
      ped.pago = !ped.pago;
      renderizarTudo();
      salvarNaNuvem();
    }
  }

  function deletarPedido(id) {
    AppData.pedidos = AppData.pedidos.filter(p => p.id !== id);
    renderizarTudo();
    salvarNaNuvem();
  }

  // Renderização da Interface
  function renderizarTudo() {
    // 1. Tabela Clientes
    const tbCli = document.getElementById('tb-clientes');
    tbCli.innerHTML = AppData.clientes.map(c => `
      <tr>
        <td>${c.nome}</td>
        <td>${c.faixa}</td>
        <td>${c.tipo}</td>
        <td>${c.fone || '-'}</td>
        <td class="actions-cell">
          <button class="btn-sm btn-danger" onclick="deletarCliente(${c.id})">Excluir</button>
        </td>
      </tr>
    `).join('');

    // Select de Clientes nos Pedidos
    const selCli = document.getElementById('ped-cliente');
    selCli.innerHTML = AppData.clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

    // 2. Valores
    document.getElementById('val-aluno').value = AppData.valores.aluno || 0;
    document.getElementById('val-prof').value = AppData.valores.professor || 0;

    // 3. Tabela Pedidos
    const tbPed = document.getElementById('tb-pedidos');
    tbPed.innerHTML = AppData.pedidos.map(p => `
      <tr>
        <td>${p.clienteNome}</td>
        <td>${p.trimestre}</td>
        <td>${p.tipoRevista === 'aluno' ? 'Aluno' : 'Professor'}</td>
        <td>${p.qtd}</td>
        <td>R$ ${p.valorTotal.toFixed(2)}</td>
        <td><span class="badge ${p.pago ? 'badge-pago' : 'badge-pendente'}">${p.pago ? 'Pago' : 'Pendente'}</span></td>
        <td class="actions-cell">
          <button class="btn-sm btn-success" onclick="alternarStatusPedido(${p.id})">
            ${p.pago ? 'Marcar Pendente' : 'Marcar Pago'}
          </button>
          <button class="btn-sm btn-danger" onclick="deletarPedido(${p.id})">Excluir</button>
        </td>
      </tr>
    `).join('');

    // 4. Métricas do Resumo
    document.getElementById('st-clientes').innerText = AppData.clientes.length;
    
    let totalRevistas = 0;
    let totalPendente = 0;
    let totalRecebido = 0;

    AppData.pedidos.forEach(p => {
      totalRevistas += p.qtd;
      if (p.pago) totalRecebido += p.valorTotal;
      else totalPendente += p.valorTotal;
    });

    document.getElementById('st-revistas').innerText = totalRevistas;
    document.getElementById('st-pendente').innerText = `R$ ${totalPendente.toFixed(2)}`;
    document.getElementById('st-recebido').innerText = `R$ ${totalRecebido.toFixed(2)}`;
  }

  function gerarRelatorioWhatsApp() {
    let totalRevistas = 0, totalPendente = 0, totalRecebido = 0;
    AppData.pedidos.forEach(p => {
      totalRevistas += p.qtd;
      if (p.pago) totalRecebido += p.valorTotal;
      else totalPendente += p.valorTotal;
    });

    const texto = `📋 *RELATÓRIO GERAL DE PEDIDOS - REVISTA EBD*\n\n` +
      `🔹 *Total de Clientes:* ${AppData.clientes.length}\n` +
      `🔹 *Total de Revistas:* ${totalRevistas}\n` +
      `🔹 *Valor Pendente:* R$ ${totalPendente.toFixed(2)}\n` +
      `🔹 *Valor Recebido:* R$ ${totalRecebido.toFixed(2)}\n\n` +
      `--- \n` +
      `🔑 *Chave Pix para Pagamento:*\n` +
      `91 98081-8289 (Telefone)`;

    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
  }

  // Inicialização
  window.addEventListener('DOMContentLoaded', carregarDaNuvem);
</script>
